; Firmware V-GUARD (docs/PLATAFORMA.md §7).
;
;   pio test -e native     testes Unity do código portátil (lib/), no notebook
;   pio run -e native      firmware nativo da fase 1 em .pio/build/native/program
;
; Os ambientes do ESP32 entram na fase 2, como na prova do #6
; (ramo research/ferramenta-platformio).

[platformio]
default_envs = native

[firmware]
; A versão que sai no STATUS, seguida do commit (firmware_version.py)
version = 0.1.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror
; Só src/native/ entra no programa do notebook. pio test compila só lib/ e test/.
build_src_filter = +<native/>
; Sem exceções e sem RTTI, como o ESP-IDF; e a versão do firmware.
extra_scripts =
    pre:native_cxx.py
    post:firmware_version.py
test_testing_command = ${platformio.build_dir}/native/program_test

; Projeto descartável para testar o toolchain (ticket #6). Não é o firmware.
;
;   pio run -e vguard      app principal (driver TWAI antigo, driver/twai.h)
;   pio run -e helper      segundo app (driver TWAI novo, esp_twai.h)
;   pio test -e native     biblioteca de lib/ testada no notebook com Unity
;   pio run -e native      executável Linux (thread + pty + SocketCAN) em .pio/build/native/program

[platformio]
default_envs = vguard, helper

[esp32_base]
; Versão fixa: a 7.1.3 traz o ESP-IDF 6.1.0 e o GCC 15.2 da Espressif.
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = espidf
monitor_speed = 115200

; build_src_filter NÃO funciona com framework = espidf (o builder avisa e ignora).
; A escolha das fontes vai para o CMake: src/CMakeLists.txt lê PROBE_APP.
[env:vguard]
extends = esp32_base
board_build.cmake_extra_args = -DPROBE_APP=vguard

[env:helper]
extends = esp32_base
board_build.cmake_extra_args = -DPROBE_APP=helper

; No env native o build_src_filter funciona (não é ESP-IDF): só src/native/ entra.
; pio test -e native não compila src/ (test_build_src = no é o padrão): só lib/ e test/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror -pthread
build_src_filter = +<native/>
; Sem exceções e sem RTTI, como o ESP-IDF por padrão (só em CXXFLAGS; veja o script).
extra_scripts = pre:native_cxx.py
